name: YakuzaVideo APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['build/**', 'assets/launcher/**', '.github/workflows/release.yml']
permissions:
  contents: read
concurrency:
  group: yakuzavideo-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          java-version: '17'
          distribution: temurin
      - name: Download pinned originals and corresponding script source
        run: |
          set -euo pipefail
          mkdir -p inputs output release-files
          curl -fL --retry 3 'https://github.com/reisxd/TizenTubeCobalt/releases/download/v2.0.3/cobalt-arm.apk' -o inputs/cobalt-arm.apk
          curl -fL --retry 3 'https://cdn.jsdelivr.net/npm/@foxreis/tizentube@1.15.2/dist/userScript.js' -o inputs/userScript.js
      - name: Adapt and test YakuzaVideo APK and updater
        env:
          COBALT_ORIGINAL: inputs/cobalt-arm.apk
          COBALT_OUTPUT: output/unsigned.apk
          COBALT_DIRECTORY: output
        run: |
          python3 build/build_apk.py inputs/cobalt-arm.apk inputs/userScript.js output "$GITHUB_RUN_NUMBER"
          python3 build/test_apk.py
          node --check output/player.js
          node build/test_updater.cjs output/player.js
          node build/test_locale.cjs output/player.js
          node build/test_feedback_menu.cjs output/player.js inputs/userScript.js
          node build/test_feedback_request.cjs output/player.js
          node build/test_feedback_ui.cjs output/player.js
          node build/test_watch_status.cjs output/player.js
          node build/test_dismissed_videos.cjs
          node build/test_sponsorblock.cjs output/player.js
          node build/test_dearrow.cjs output/player.js
          node build/test_settings_apply.cjs output/player.js
          node build/test_startup.cjs output/player.js
          node build/test_startup_home.cjs output/player.js inputs/userScript.js
      - name: Align, sign and verify APK
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$SIGNING_KEY" | base64 --decode > "$RUNNER_TEMP/yakuzavideo.p12"
          tools_dir="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$tools_dir/zipalign" -p -f 4 output/unsigned.apk output/aligned.apk
          "$tools_dir/apksigner" sign --v4-signing-enabled false --ks-type PKCS12 --ks "$RUNNER_TEMP/yakuzavideo.p12" --ks-key-alias "$ALIAS" --ks-pass env:KEY_STORE_PASSWORD --key-pass env:KEY_PASSWORD --out release-files/YakuzaVideo-armeabi-v7a.apk output/aligned.apk
          "$tools_dir/apksigner" verify --verbose --print-certs release-files/YakuzaVideo-armeabi-v7a.apk > output/signature.txt
          "$tools_dir/zipalign" -c -p 4 release-files/YakuzaVideo-armeabi-v7a.apk
          "$tools_dir/aapt" dump badging release-files/YakuzaVideo-armeabi-v7a.apk > output/badging.txt
          python3 build/verify_android.py output/badging.txt
          cp output/player.js output/update.json output/build.json output/signature.txt output/badging.txt release-files/
          (cd release-files && sha256sum YakuzaVideo-armeabi-v7a.apk player.js update.json > SHA256SUMS.txt)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: yakuzavideo
          path: release-files/*
          if-no-files-found: error
      - name: Remove signing material
        if: always()
        run: rm -f -- "$RUNNER_TEMP/yakuzavideo.p12"
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Download verified deliverables
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh run download "$GITHUB_RUN_ID" --name yakuzavideo --dir release-files
      - name: Publish YakuzaVideo userscript and signed release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 build/publish_runtime.py
          version="$(python3 -c 'import json; print(json.load(open("release-files/build.json"))["version"])')"
          cat > notes.md <<'EOF'
          YakuzaVideo für den Fernseher.

          - App-Name: YakuzaVideo
          - Eigene App-Kennung: com.yakuza.video
          - Echte armeabi-v7a-APK, Werbeblockierung und GitHub-Update-Abruf.
          - SponsorBlock mit Übernahme geänderter Einstellungen beim laufenden Video.
          - DeArrow-Titel und Vorschaubilder mit sofortiger Ein-/Ausschaltung.
          - Statusanzeige für geladene Segmentdaten und angewendete Titel/Bilder.
          - Animiertes YakuzaVideo-Logo beim Start, mindestens drei Sekunden sichtbar.
          - Eigenes App-Icon und passende TV-Startkachel.
          - Empfehlungen beim App-Start und nach Rückkehr aus dem Hintergrund aktualisieren.
          - Videomenü mit „Kein Interesse“ und „Keine Videos von diesem Kanal empfehlen“.
          - „Schon angesehen“ und „Gefällt mir nicht“ an YouTube senden.
          - Abgelehnte Videos sofort ausblenden und nach Aktualisieren oder Neustart je Profil aus den Empfehlungen filtern.
          - Roter Fortschrittsbalken an angeschauten Videokacheln.
          - Angefangene Videos an der gespeicherten Stelle fortsetzen, auch nach App-Neustart.
          - Deutsches Menü beim langen Drücken auf OK und deutsche Rückmeldungen.
          - Bereinigte Option für die Begrüßungsnachricht beim Start.
          - Mindestens Android 7 / API 24.

          YakuzaVideo-armeabi-v7a.apk installieren und bei YouTube anmelden.
          Android verlangt eine Installationsbestätigung für Updates.
          EOF
          gh release create "v$version" release-files/YakuzaVideo-armeabi-v7a.apk --target "$(cat runtime-commit.txt)" --title "YakuzaVideo $version" --notes-file notes.md --latest
          python3 build/verify_runtime.py
